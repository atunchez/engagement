<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000}iframe{border:0;display:block;width:420px;height:2200px}</style></head>
<body><iframe id="f" src="quiz.html?reveal=1"></iframe>
<script>
  const f = document.getElementById("f");
  f.onload = () => {
    const d = () => f.contentWindow.document;
    const steps = [
      () => d().getElementById("startBtn").click(),
      () => d().getElementById("options").children[1].click(), // q1 wrong
      () => d().getElementById("nextBtn").click(),
      () => d().getElementById("options").children[1].click(), // q2 wrong
      () => d().getElementById("nextBtn").click(),
      () => d().getElementById("options").children[1].click(), // q3 wrong
      () => d().getElementById("nextBtn").click(),             // now on q4
      () => d().getElementById("checkOrderBtn").click(),       // lock the shuffle in
    ];
    let i = 0;
    (function step() {
      if (i >= steps.length) return;
      try { steps[i++](); } catch (e) { console.log("step failed", i, e.message); }
      setTimeout(step, 350);
    })();
  };
</script></body></html>
