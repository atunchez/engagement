<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard — Alex &amp; Amanda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=2" />
  <link rel="stylesheet" href="fun.css?v=11" />
</head>
<!--
  Guests reach this from the tab bar. Shows standings and which questions are
  tripping people up — never the answers themselves, so it's safe to leave
  open while the quiz is still sealed.
-->
<body class="board">

  <nav class="tabs tabs--dark">
    <a href="quiz.html"><span class="tabs__full">The Quiz</span><span class="tabs__short">Quiz</span></a>
    <a href="camera.html"><span class="tabs__full">Disposable Cam</span><span class="tabs__short">Camera</span></a>
    <a href="board.html" aria-current="page"><span class="tabs__full">Leaderboard</span><span class="tabs__short">Board</span></a>
  </nav>

  <header class="board__head">
    <h1>How well do you know us?</h1>
    <p class="board__sub" id="played">—</p>
  </header>

  <main class="board__grid">
    <section class="board__col">
      <h2>Leaderboard</h2>
      <ol class="board__list" id="list">
        <li class="board__empty">Waiting for the first score…</li>
      </ol>
      <p class="board__you" id="you" hidden></p>
    </section>

    <section class="board__col">
      <h2>Hardest questions</h2>
      <div class="board__stats" id="stats">
        <p class="board__empty">Nobody's played yet.</p>
      </div>
    </section>
  </main>

  <footer class="board__foot">
    <span id="status">connecting…</span>
    <span class="board__release" id="release"></span>
  </footer>

  <script src="config.js?v=11"></script>
  <script src="api.js?v=11"></script>
  <script src="quiz-data.js?v=11"></script>
  <script src="board.js?v=11"></script>
</body>
</html>
